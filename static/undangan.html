<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Undangan workspace — Sales Akrual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--bg2:#F6F3FF;--lav:#EDE7FF;--ink:#1E1E1E;--ink2:#5B5B6B;--muted:#8A8A99;--line:#E6E3F0;--line2:#1E1E1E;--orange:#F4561E;--purple:#5E1AF1;--purple-dk:#340E7C;--warn:#C7811A;--bad:#C62828;--good:#1B8A4C;--radius:10px;--shadow:5px 5px 10px rgba(0,0,0,.08)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,var(--lav),#fff 60%);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:14px;line-height:1.45}
.box{max-width:440px;margin:10vh auto 0;padding:0 16px}
.card{background:#fff;border:1px solid var(--line2);border-radius:var(--radius);padding:24px 22px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:38px;height:38px;border-radius:8px;background:var(--purple-dk);display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px}
h1{font-size:18px;margin:0;font-weight:800}
h2{font-size:17px;margin:0 0 6px;font-weight:800}
.sub{color:var(--ink2);font-size:12px}
p{margin:8px 0;color:var(--ink2)}
p b{color:var(--ink)}
.inv{border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:12px;background:var(--bg2)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--lav);color:var(--purple-dk)}
.note{background:#FFF2E0;border-left:4px solid var(--warn);padding:8px 10px;border-radius:6px;font-size:12px;color:var(--ink2);margin:10px 0}
.note.bad{background:#FDE7E7;border-left-color:var(--bad)}
.note.ok{background:#E3F4EA;border-left-color:var(--good)}
.me{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);margin-top:14px}
.me img{width:22px;height:22px;border-radius:50%}
button,.btn{font:inherit;font-weight:700;width:100%;margin-top:12px;padding:10px 14px;border-radius:6px;border:1px solid var(--orange);background:var(--orange);color:#fff;cursor:pointer;box-shadow:var(--shadow);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px}
button.ghost,.btn.ghost{background:#fff;color:var(--ink2);border-color:var(--line);box-shadow:none;margin-top:8px}
button:disabled{opacity:.6;cursor:default}
.btn svg{width:18px;height:18px}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
.foot a{color:var(--purple);font-weight:700}
</style>
</head>
<body>
<div class="box">
  <div class="card">
    <div class="brand"><div class="logo">MKG</div><div><h1>Sales Akrual</h1><div class="sub">Undangan bergabung ke workspace</div></div></div>
    <div id="body"><p>memuat undangan…</p></div>
    <div class="err" id="err"></div>
  </div>
  <div class="foot" id="foot"><a href="/">Ke halaman utama</a></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const G='<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.3 0 11.7-2.1 15.6-5.7l-7.7-6c-2.1 1.4-4.8 2.3-7.9 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>';
const q=new URLSearchParams(location.search), T=q.get('t')||'';
if(q.get('err')) $('#err').textContent=q.get('err');
const peran=r=>r==='admin'?'<b>admin</b> (bisa kelola anggota &amp; hapus toko)':'<b>anggota</b>';

async function post(url,body){ const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); if(!r.ok){ let m=r.statusText; try{ m=(await r.json()).detail||m }catch(_){} throw new Error(m);} return r.json(); }

function card(i, me, google){
  let h=`<div class="inv"><h2>${esc(i.workspace)}</h2><p>Diundang oleh <b>${esc(i.invited_by)}</b> sebagai ${peran(i.role)}.<br>Untuk email <b>${esc(i.email)}</b>.</p>`;
  const ex=i.existing;
  if(me && me.email!==i.email){
    h+=`<div class="note bad">Anda sedang masuk sebagai <b>${esc(me.email||me.name)}</b>${me.email?'':' (akun password, tanpa email Google)'}, sedangkan undangan ini untuk <b>${esc(i.email)}</b>. Keluar dulu, lalu masuk dengan email yang diundang.</div>`;
    h+=`<button class="ghost" onclick="logoutThen('${esc(i.token)}')">Keluar &amp; masuk dengan ${esc(i.email)}</button>`;
  }else if(ex && ex.same){
    h+=`<div class="note ok">Anda sudah menjadi anggota workspace ini.</div><a class="btn" href="/">Buka dashboard</a>`;
  }else{
    if(ex) h+=`<div class="note">Akun <b>${esc(i.email)}</b> saat ini ada di workspace <b>${esc(ex.workspace)}</b>. Menerima undangan akan <b>memindahkan</b> akun Anda ke <b>${esc(i.workspace)}</b> — data workspace lama tetap tersimpan, tetapi Anda tidak lagi melihatnya dari akun ini.</div>`;
    if(me){
      h+=`<button onclick="accept('${esc(i.token)}',this)">Terima undangan${ex?' & pindah workspace':''}</button>`;
    }else if(google){
      h+=`<a class="btn" href="/auth/google?mode=invite&t=${encodeURIComponent(i.token)}">${G}<span>Terima &amp; masuk dengan Google</span></a>`;
    }else{
      h+=`<div class="note bad">Masuk dengan Google belum diaktifkan di server ini.</div>`;
    }
    if(me) h+=`<button class="ghost" onclick="decline('${esc(i.token)}',this)">Tolak undangan</button>`;
  }
  return h+'</div>';
}

async function load(){
  let d;
  try{ d=await (await fetch('/api/undangan'+(T?'?t='+encodeURIComponent(T):''))).json(); }catch(e){ $('#body').innerHTML='<p>gagal memuat — coba muat ulang halaman</p>'; return; }
  let h='';
  if(d.error) h+=`<div class="note bad">${esc(d.error)}</div>`;
  if(!d.invites.length && !d.error){
    h+= d.me ? `<p>Tidak ada undangan yang menunggu untuk <b>${esc(d.me.email||d.me.name)}</b>.</p>` : `<p>Buka tautan undangan dari email Anda, atau <a href="/login" style="color:var(--purple);font-weight:700">masuk</a> dengan email Google yang diundang untuk melihat undangan.</p>`;
  }
  h+=d.invites.map(i=>card(i,d.me,d.google)).join('');
  if(d.me) h+=`<div class="me">${d.me.picture?`<img src="${esc(d.me.picture)}" alt="">`:''}<span>${d.me.kind==='pending'?'Masuk Google sebagai':'Sedang masuk sebagai'} <b>${esc(d.me.email||d.me.name)}</b>${d.me.workspace?` · workspace ${esc(d.me.workspace)}`:''}</span></div>`;
  $('#body').innerHTML=h;
}
async function accept(t,btn){ btn.disabled=true; $('#err').textContent=''; try{ const r=await post('/api/undangan/terima',{t}); $('#body').innerHTML=`<div class="note ok">${r.status==='moved'?'Akun Anda dipindahkan ke':'Anda bergabung ke'} workspace <b>${esc(r.workspace)}</b>.</div><a class="btn" href="/">Buka dashboard</a>`; setTimeout(()=>location.href='/',1200); }catch(e){ $('#err').textContent=e.message; btn.disabled=false; } }
async function decline(t,btn){ if(!confirm('Tolak undangan ini?')) return; btn.disabled=true; try{ await post('/api/undangan/tolak',{t}); load(); }catch(e){ $('#err').textContent=e.message; btn.disabled=false; } }
async function logoutThen(t){ try{ await post('/api/logout',{}); }catch(_){} location.href='/auth/google?mode=invite&t='+encodeURIComponent(t); }
load();
</script>
</body>
</html>
